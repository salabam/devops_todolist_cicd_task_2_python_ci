name: python-deployment
run-name: ${{ github.actor }} - ${{ github.sha }}
env:
  PythonVersion: 3.8
on:
  push: 
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --exit-zero --show-source --statistics

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=10 --statistics

      - name: Generate coverage
        run: |
          coverage run src/manage.py test

      - name: Display the coverage report to console
        run: |
          coverage report -m

      - name: Upload Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: python-code
          path: ../
